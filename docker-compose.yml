version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  candidate-ui:
    build: ./frontend
    container_name: rolesync-candidate-ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  recruiter-ui:
    build: ./recruiter-frontend
    container_name: rolesync-recruiter-ui
    ports:
      - "5174:5174"
    volumes:
      - ./recruiter-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
