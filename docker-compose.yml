version: "3.9"

services:
  backend:
    build: ./backend
    container_name: rolesync-backend
    ports:
      - "8000:8000"

  candidate-ui:
    build: ./frontend
    container_name: rolesync-candidate-ui
    ports:
      - "5173:5173"
    depends_on:
      - backend

  recruiter-ui:
    build: ./recruiter-frontend
    container_name: rolesync-recruiter-ui
    ports:
      - "5174:5174"
    depends_on:
      - backend
